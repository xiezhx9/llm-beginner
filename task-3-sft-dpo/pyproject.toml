[project]
name = "task-3-sft-dpo"
version = "0.1.0"
description = "Task 3: LoRA supervised fine-tuning and DPO alignment"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=0.27",
    "datasets>=2.14",
    "huggingface-hub>=0.20",
    "matplotlib>=3.8",
    "numpy>=1.23",
    "pandas>=2.0",
    "requests>=2.31",
    "safetensors>=0.4",
    "torch>=2.7",
    "tqdm>=4.65",
    "transformers>=4.40",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "pytest>=8.0",
]

[tool.uv]
package = false
